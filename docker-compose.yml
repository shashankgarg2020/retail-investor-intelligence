# Local stack: Postgres with pgvector, the API, and the dashboard.
#
#   docker compose up --build
#   docker compose run --rm api python -m scripts.init_db
#   docker compose run --rm api python -m scripts.collect_data --company all
#   docker compose run --rm api python -m scripts.run_pipeline
#   docker compose --profile scheduler up -d scheduler     # optional: collect + process every 6 h
#
# API keys are read from .env. DATABASE_URL is overridden below to point at the
# local database container, so a hosted connection string in .env is ignored here.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rii
      POSTGRES_PASSWORD: rii_local_only
      POSTGRES_DB: rii
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rii -d rii"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rii:rii_local_only@db:5432/rii
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/app/.cache/huggingface

  ui:
    build: .
    command: streamlit run src/frontend/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

  # Periodic collection and processing (APScheduler). Off by default; start with --profile scheduler.
  scheduler:
    build: .
    profiles: ["scheduler"]
    command: python -m scripts.scheduler --hours 6
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rii:rii_local_only@db:5432/rii
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf_cache:/app/.cache/huggingface

volumes:
  pgdata:
  hf_cache:
